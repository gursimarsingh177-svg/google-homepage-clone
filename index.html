<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Educational Google homepage layout clone">
  <title>Google Homepage Clone — College Project</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="topbar">
    <nav aria-label="Top navigation">
      <a href="#about">About</a>
      <a href="#store">Store</a>
      <span class="demo-label">Educational Demo</span>
    </nav>
  </header>

  <main class="homepage">
    <section class="search-area">

      <div class="logo" aria-label="Google-style logo">
        <span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span>
      </div>

      <p class="demo-note">A college project made with HTML and CSS</p>

      <form class="search-form" role="search">
        <label class="visually-hidden" for="search-input">
          Search field for demonstration
        </label>

        <span class="search-icon" aria-hidden="true">⌕</span>

        <input
          id="search-input"
          type="search"
          name="q"
          placeholder="Search (demo only)"
        >
      </form>

      <div class="actions">
        <button type="button">Google Search</button>
        <button type="button">I'm Feeling Lucky</button>
      </div>

      <p class="demo-note">
        This educational page does not perform real searches.
      </p>

    </section>
  </main>

  <footer class="footer">
    <nav aria-label="Left footer links">
      <a href="#advertising">Advertising</a>
      <a href="#business">Business</a>
    </nav>

    <nav aria-label="Right footer links">
      <a href="#privacy">Privacy</a>
      <a href="#terms">Terms</a>
      <a href="#settings">Settings</a>
    </nav>
  </footer>

</body>
</html>
